plugins = []
headers = []
redirects = []

[database]

  [database.migrations]
  path = "/opt/build/repo/netlify/database/migrations"

[build]
publish = "/opt/build/repo/public"
publishOrigin = "config"
commandOrigin = "config"
command = "node scripts/prepare-site.mjs"

  [build.environment]
  NODE_VERSION = "24"

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[dev]
framework = "#static"
publish = "."

[functions]

  [functions."*"]